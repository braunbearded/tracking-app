name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        run: echo "$ANDROID_SIGNING_KEY_BASE64" | base64 -d > release.jks
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signing key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          signing_sha256=$("$apksigner" verify --print-certs app/build/outputs/apk/release/zaelio.apk | sed -n 's/.*SHA-256 digest: //p')
          expected_sha256=$(awk '/AllowedAPKSigningKeys:/ { sub(/.*AllowedAPKSigningKeys:[[:space:]]*/, ""); if ($0 != "") { print; exit } getline; gsub(/^[[:space:]-]*/, ""); print; exit }' docs/fdroiddata/com.zaelio.app.yml)
          test "$signing_sha256" = "$expected_sha256"
          {
            cat CHANGELOG.md
            printf '\n## APK signing certificate\n\n```text\n%s\n```\n' "$signing_sha256"
          } > release-notes.md
          echo "APK signing certificate SHA-256: $signing_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/zaelio.apk \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
