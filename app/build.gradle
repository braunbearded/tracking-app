plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zaelio.app'
    compileSdk 36

    def signingReady = System.getenv('ANDROID_KEYSTORE_PATH') &&
            System.getenv('ANDROID_KEYSTORE_PASSWORD') &&
            System.getenv('ANDROID_KEY_ALIAS') &&
            System.getenv('ANDROID_KEY_PASSWORD')

    testOptions {
        unitTests.includeAndroidResources = true
    }

    defaultConfig {
        applicationId 'com.zaelio.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-commons:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}
